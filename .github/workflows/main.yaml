name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  node_matrix_tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
      - name: Install Dependencies
        run: npm ci --ignore-scripts
      - name: Run Test Cases
        run: npm run test

  npm_test:
    runs-on: ubuntu-latest
    needs: node_matrix_tests
    if: success()
    steps:
      - name: Final status
        run: echo "✅ All tests passed for Node.js 22 and 24"
