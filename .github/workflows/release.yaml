name: Release [Manual]

# Publishing is intentionally manual. npm trusted publishing must be configured
# with this workflow filename (release.yaml) before the first run.
on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  release:
    name: Verify and publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_COMMIT_GH_PAT || github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Update npm for trusted publishing
        run: npm install --global npm@latest

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify package
        run: |
          npm test
          HUSKY=0 npm run package:check

      - name: Configure release commit author
        env:
          CONFIG_USERNAME: ${{ vars.RELEASE_COMMIT_USERNAME }}
          CONFIG_EMAIL: ${{ vars.RELEASE_COMMIT_EMAIL }}
        run: |
          git config user.name "${CONFIG_USERNAME:-github-actions[bot]}"
          git config user.email "${CONFIG_EMAIL:-41898282+github-actions[bot]@users.noreply.github.com}"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_COMMIT_GH_PAT || github.token }}
          HUSKY: 0
        run: npx --no-install semantic-release
