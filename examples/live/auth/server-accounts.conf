# Multi-Tenancy with Accounts — exports/imports between accounts
# Run: nats-server -c server-accounts.conf
port: 4222
host: 127.0.0.1
accounts: {
  SYS: {
    users: [{user: "sys", password: "sys"}]
  }
  WEATHER: {
    users: [{user: "weather", password: "weather"}]
    exports: [
      { service: "weather.>" }       # cross-account request-reply service
      { stream: "weather.events.>" } # cross-account stream (broadcast)
    ]
  }
  APP: {
    users: [{user: "app", password: "app"}]
    imports: [
      { service: { account: "WEATHER", subject: "weather.>" } }
      { stream:  { account: "WEATHER", subject: "weather.events.>" } }
    ]
  }
}
system_account: SYS
log_file: "./nats-server.log"
