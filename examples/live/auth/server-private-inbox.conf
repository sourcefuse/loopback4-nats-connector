# Private Inbox — service responders with allow_responses
# Pattern from natsbyexample.com/examples/auth/private-inbox
# Run: nats-server -c server-private-inbox.conf
port: 4222
host: 127.0.0.1
accounts: {
  APP: {
    users: [
      {
        user: "greeter", password: "greeter",
        permissions: {
          sub: { allow: ["services.greet"] }
          allow_responses: true   # allows publishing to the requester's _INBOX.<token>
        }
      },
      {
        user: "joe", password: "joe",
        permissions: {
          pub: { allow: ["joe.>", "services.*"] }
          sub: { allow: ["_INBOX.>"] }
        }
      },
      {
        user: "pam", password: "pam",
        permissions: {
          pub: { allow: ["pam.>", "services.*"] }
          sub: { allow: ["_INBOX.>"] }
        }
      }
    ]
  }
}
log_file: "./nats-server.log"
