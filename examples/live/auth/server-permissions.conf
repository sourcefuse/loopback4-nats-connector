# Authorization — per-user pub/sub permissions
# Run: nats-server -c server-permissions.conf
port: 4222
host: 127.0.0.1
authorization {
  PUBLISHER = {
    publish: ["events.>", "audit.>"]
    subscribe: "_INBOX.>"
  }
  SUBSCRIBER = {
    subscribe: ["events.>"]
    publish: {deny: ">"}
  }
  ADMIN = {
    publish: ">"
    subscribe: ">"
  }
  users: [
    {user: "publisher", password: "pub", permissions: $PUBLISHER}
    {user: "subscriber", password: "sub", permissions: $SUBSCRIBER}
    {user: "admin", password: "admin", permissions: $ADMIN}
  ]
}
log_file: "./nats-server.log"
