# Auth Callout (Centralized) — natsbyexample.com/examples/auth/callout
# Inject ISSUER_NKEY / ISSUER_XKEY env vars before starting; the callout
# service itself signs auth responses with the matching seeds.
#
# Run:
#   npm run gen-callout-keys     # writes bin/callout-keys.json + .env
#   source ./bin/.callout.env    # exports ISSUER_NKEY + ISSUER_XKEY
#   envsubst < server-callout.conf > server-callout.live.conf
#   nats-server -c server-callout.live.conf &
#   npm run callout-service       # starts the auth callout service
#   AUTH_MODE=userpass NATS_USER=alice NATS_PASS=alice npm start
port: 4222
host: 127.0.0.1
accounts {
  AUTH {
    users: [
      { user: "auth", password: "auth" }
    ]
  }
  APP { }
  SYS { }
}
authorization {
  auth_callout {
    issuer: "${ISSUER_NKEY}"
    users:  [ "auth" ]
    account: "AUTH"
    xkey: "${ISSUER_XKEY}"
  }
}
system_account: SYS
log_file: "./nats-server.log"
