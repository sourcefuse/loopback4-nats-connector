# 03-multi-tenant-dynamic — bootstrap broker (optional baseline).
# Dynamic example boots with NO static connections, so this broker
# is not required at start. Provided for parity / future scenarios
# where the app holds an always-on baseline connection.
# Run: `nats-server -c server-bootstrap.conf`
port: 4222
host: 127.0.0.1
log_file: "./nats-bootstrap.log"
debug: false
trace: false
logtime: true
